services:
  postgres:
    image: postgres:16-alpine
    container_name: db_sistema
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: eventfunnel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventfunnel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rede_sistema

  redis:
    image: redis:7-alpine
    container_name: redis_sistema
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rede_sistema

  app_sistema:
    build: .
    container_name: app_sistema
    restart: always
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rede_sistema

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: frontend_sistema
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - app_sistema
    networks:
      - rede_sistema

networks:
  rede_sistema:
    driver: bridge

volumes:
  pgdata: