services:
  postgres:
    image: postgres:16-alpine
    container_name: db_sistema
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: eventfunnel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventfunnel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rede_sistema

  redis:
    image: redis:7-alpine
    container_name: redis_sistema
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rede_sistema

  n8n:
    image: n8nio/n8n:latest
    container_name: app_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rede_sistema

  app_sistema:
    build: .
    container_name: app_sistema
    restart: always
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_USER=app_evento_user
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - rede_sistema

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: frontend_sistema
    restart: always
    ports:
      - "8081:80"
    depends_on:
      app_sistema:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - rede_sistema

networks:
  rede_sistema:
    driver: bridge

volumes:
  pgdata:
  n8n_data: