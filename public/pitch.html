<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa de Pitch & Ofertas | EventFunnel</title>
    <!-- Google Material Symbols Outlined -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <!-- Folha Centralizada Master Única -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="pitch-body">
    <div class="app-layout">
      <!-- SIDEBAR GLOBAL D.CC -->
      <aside class="app-sidebar"></aside>

      <!-- ÁREA PRINCIPAL -->
      <main class="app-main">
        <header class="app-header">
          <div class="header-title-block">
            <h1>Mesa de PITCH & Ofertas</h1>
          </div>
          <div class="header-actions">
            <button class="btn-icon" id="themeToggleBtn" title="Alternar Tema">
              <span class="material-symbols-outlined">dark_mode</span>
            </button>
          </div>
        </header>

        <div class="app-content">
          <!-- BANNER DE INTRODUÇÃO & AÇÕES DO PITCH -->
          <div class="pitch-intro-banner">
            <div class="pitch-banner-content">
              <div class="pitch-banner-badge">
                <span class="material-symbols-outlined">campaign</span>
                <span>Configuração de Oferta de Palco</span>
              </div>
              <h2 class="pitch-main-title">Condições Comerciais & Slides de Pitch</h2>
              <p class="pitch-subtitle">
                Defina os valores, parcelamentos e faça upload das fotos dos slides da oferta. Os
                dados e condições só ficam visíveis para os vendedores no momento em que clicar em
                <strong>Liberar Oferta</strong>.
              </p>
            </div>
            <button type="button" class="btn btn-secondary" id="btnRecarregar">
              <span class="material-symbols-outlined">sync</span>
              <span>Atualizar Ofertas</span>
            </button>
          </div>

          <!-- GRELHA DINÂMICA DE PRODUTOS DO PITCH -->
          <div class="products-pitch-grid" id="gridProdutosPitch">
            <!-- Cards injetados via pitch.js -->
          </div>
        </div>
      </main>
    </div>

    <!-- CONTAINER DE TOASTS -->
    <div id="toastContainer"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/pitch.js"></script>
  </body>
</html>
