<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Produtos | EventFunnel</title>
    <!-- Google Material Symbols Outlined -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <!-- Folha Centralizada Master -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="produtos-body">
    <div class="app-layout">
      <!-- SIDEBAR GLOBAL D.CC -->
      <aside class="app-sidebar"></aside>

      <!-- ÁREA PRINCIPAL -->
      <main class="app-main">
        <header class="app-header">
          <div class="header-title-block">
            <div style="display: flex; align-items: center; gap: 0.75rem">
              <h1>Catálogo de Produtos & Ofertas</h1>
              <span class="kpi-badge-pill orange" id="badgeTotalProdutos">0</span>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn-icon" id="themeToggleBtn" title="Alternar Tema">
              <span class="material-symbols-outlined">dark_mode</span>
            </button>
          </div>
        </header>

        <div class="app-content">
          <div class="um-page-container">
            <!-- BARRA DE FERRAMENTAS -->
            <div class="um-toolbar">
              <div class="um-search-wrap">
                <span class="material-symbols-outlined search-icon">search</span>
                <input
                  type="text"
                  id="inputBuscaProduto"
                  class="form-control search-input"
                  placeholder="Buscar produto por nome..."
                  autocomplete="off"
                />
              </div>

              <div class="um-actions-right">
                <button type="button" class="btn btn-primary btn-sm" id="btnNovoProduto">
                  <span class="material-symbols-outlined" style="font-size: 18px">add_circle</span>
                  <span>Novo Produto</span>
                </button>
              </div>
            </div>

            <!-- TABELA DE PRODUTOS -->
            <div class="dash-card" style="padding: 0; overflow: hidden">
              <div class="table-responsive">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th style="width: 80px">ID</th>
                      <th>Produto</th>
                      <th>Valor Base</th>
                      <th style="text-align: right; width: 140px">Ações</th>
                    </tr>
                  </thead>
                  <tbody id="listaProdutosCorpo">
                    <!-- Renderizado dinamicamente via produtos.js -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE PRODUTO -->
    <div class="modal-overlay" id="modalProduto">
      <div class="modal-card" style="max-width: 480px">
        <div class="modal-header">
          <div>
            <h3 class="modal-title" id="modalProdutoTitulo">Cadastrar Novo Produto</h3>
            <p class="modal-subtitle">Defina o nome oficial e o valor de tabela do programa</p>
          </div>
          <button
            type="button"
            class="btn-sidebar-options"
            id="btnFecharModalProduto"
            title="Fechar"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <form id="formProduto">
          <input type="hidden" id="produtoId" />

          <div class="form-group mb-sm">
            <label for="inputNomeProduto">Nome do Produto / Imersão *</label>
            <input
              type="text"
              id="inputNomeProduto"
              class="form-control"
              required
              placeholder="Ex: Mentoria Individual Premium"
            />
          </div>

          <div class="form-group mb-sm">
            <label for="inputValorBase">Valor Base de Tabela (R$) *</label>
            <div class="price-input-container">
              <span class="price-currency-tag">R$</span>
              <input
                type="number"
                step="0.01"
                min="0"
                id="inputValorBase"
                class="form-control text-accent"
                required
                placeholder="0,00"
              />
            </div>
          </div>

          <div class="modal-actions-footer">
            <button type="button" class="btn btn-secondary" id="btnCancelarProduto">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary" id="btnSalvarProduto">
              <span class="material-symbols-outlined">check</span>
              <span>Salvar Produto</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- CONTAINER DE NOTIFICAÇÕES TOAST -->
    <div id="toastContainer"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/produtos.js"></script>
  </body>
</html>
