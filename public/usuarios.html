<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Equipe | EventFunnel</title>
    <!-- Google Material Symbols Outlined -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <!-- Folha Centralizada Master Única -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="usuarios-body">
    <div class="app-layout">
      <!-- SIDEBAR GLOBAL D.CC -->
      <aside class="app-sidebar"></aside>

      <!-- ÁREA PRINCIPAL -->
      <main class="app-main">
        <header class="app-header">
          <div class="header-title-block">
            <div class="um-title-wrap">
              <h1>Gestão de Equipe</h1>
              <span class="kpi-badge-pill orange" id="badgeTotalUsuarios">0</span>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn-icon" id="themeToggleBtn" title="Alternar Tema">
              <span class="material-symbols-outlined">dark_mode</span>
            </button>
          </div>
        </header>

        <div class="app-content">
          <div class="um-page-container">
            <!-- TOOLBAR SUPERIOR -->
            <div class="um-toolbar">
              <div class="um-view-toggle">
                <button type="button" class="view-btn active" id="btnViewTable">
                  <span class="material-symbols-outlined">table_rows</span>
                  <span>Tabela</span>
                </button>
                <button type="button" class="view-btn" id="btnViewBoard">
                  <span class="material-symbols-outlined">view_kanban</span>
                  <span>Colunas</span>
                </button>
              </div>

              <div class="um-search-wrap">
                <span class="material-symbols-outlined search-icon">search</span>
                <input
                  type="text"
                  id="inputBuscaUsuario"
                  class="form-control search-input"
                  placeholder="Buscar por nome ou e-mail..."
                  autocomplete="off"
                />
              </div>

              <div class="um-actions-right">
                <button type="button" class="btn btn-secondary btn-sm" id="btnToggleInativos">
                  <span class="material-symbols-outlined" style="font-size: 16px"
                    >visibility_off</span
                  >
                  <span>Ocultar Inativos</span>
                </button>
                <button type="button" class="btn btn-primary btn-sm" id="btnNovoUsuario">
                  <span class="material-symbols-outlined" style="font-size: 16px">person_add</span>
                  <span>Novo Operador</span>
                </button>
              </div>
            </div>

            <!-- FILTRO DE PAPEL -->
            <div class="um-filter-row">
              <div class="um-select-filter">
                <label for="selectFiltroPapel">Perfil de Acesso:</label>
                <select id="selectFiltroPapel" class="form-control">
                  <option value="todos">Todos</option>
                  <option value="admin">Admin</option>
                  <option value="comercial">Comercial</option>
                  <option value="financeiro">Financeiro</option>
                </select>
              </div>
            </div>

            <!-- VISÃO TABELA -->
            <div class="dash-card" id="containerTabela" style="padding: 0; overflow: hidden">
              <div class="table-responsive">
                <table class="data-table um-table" id="tabelaUsuarios">
                  <thead>
                    <tr>
                      <th>Nome Completo</th>
                      <th>E-mail</th>
                      <th>Role / Perfil</th>
                      <th>Status</th>
                      <th style="text-align: right">Ações</th>
                    </tr>
                  </thead>
                  <tbody id="listaUsuariosCorpo">
                    <!-- Preenchido via usuarios.js -->
                  </tbody>
                </table>
              </div>
            </div>

            <!-- VISÃO KANBAN BOARD -->
            <div class="um-board-container" id="containerBoard" style="display: none">
              <!-- Renderizado via usuarios.js -->
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL ADD/EDIT USER -->
    <div class="modal-overlay" id="modalUsuario">
      <div class="modal-card" style="max-width: 480px">
        <div class="modal-header">
          <div>
            <h3 class="modal-title" id="modalUsuarioTitulo">Cadastrar Novo Usuário</h3>
            <p class="modal-subtitle">Defina as credenciais e o nível de acesso da equipe</p>
          </div>
          <button
            type="button"
            class="btn-sidebar-options"
            id="btnFecharModalUsuario"
            title="Fechar"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <form id="formUsuario">
          <input type="hidden" id="usuarioId" />

          <div class="form-group mb-sm">
            <label for="inputNomeUsuario">Nome Completo *</label>
            <input
              type="text"
              id="inputNomeUsuario"
              class="form-control"
              required
              placeholder="Ex: Rodrigo Moreira"
            />
          </div>

          <div class="form-group mb-sm">
            <label for="inputEmailUsuario">E-mail Corporativo *</label>
            <input
              type="email"
              id="inputEmailUsuario"
              class="form-control"
              required
              placeholder="nome@empresa.com"
            />
          </div>

          <div class="form-group mb-sm">
            <label for="inputSenhaUsuario">Senha de Acesso *</label>
            <input
              type="password"
              id="inputSenhaUsuario"
              class="form-control"
              placeholder="Mínimo 6 caracteres"
            />
          </div>

          <div class="form-group mb-sm">
            <label for="selectPapelUsuario">Perfil de Acesso (Role) *</label>
            <select id="selectPapelUsuario" class="form-control" required>
              <option value="comercial">Comercial (Captação & Entrevistas)</option>
              <option value="financeiro">Financeiro (Propostas & Crédito)</option>
              <option value="admin">Administrador (Acesso Total)</option>
            </select>
          </div>

          <div class="modal-actions-footer">
            <button type="button" class="btn btn-secondary" id="btnCancelarUsuario">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary" id="btnSalvarUsuario">
              <span class="material-symbols-outlined">check</span>
              <span>Salvar Operador</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="toastContainer"></div>
    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/usuarios.js"></script>
  </body>
</html>
