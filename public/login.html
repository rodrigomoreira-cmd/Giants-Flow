<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso ao Cockpit | EventFunnel</title>
    <!-- Google Material Symbols Outlined -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="login-body">
    <div class="login-viewport">
      <!-- CARTÃO CENTRAL D.CC -->
      <div class="login-card">
        <!-- CABEÇALHO DA MARCA -->
        <div class="login-header">
          <div class="login-brand-icon">
            <span class="material-symbols-outlined">filter_alt</span>
          </div>
          <h1 class="login-brand-title">EventFunnel</h1>
          <p class="login-brand-subtitle">Cockpit Operacional de Conversão de Alto Ticket</p>
        </div>

        <!-- MENSAGEM DE ALERTA/ERRO -->
        <div class="login-alert" id="boxAlertaErro" style="display: none">
          <span class="material-symbols-outlined login-alert-icon">error</span>
          <span class="login-alert-text" id="textoAlertaErro">Credenciais incorretas</span>
        </div>

        <!-- FORMULÁRIO DE AUTENTICAÇÃO -->
        <form id="formLogin" class="login-form" autocomplete="on">
          <!-- CAMPO E-MAIL -->
          <div class="form-group">
            <label class="form-label" for="inputEmail">E-mail Corporativo</label>
            <div class="input-icon-wrapper">
              <span class="material-symbols-outlined input-icon">mail</span>
              <input
                type="email"
                id="inputEmail"
                name="email"
                class="form-control"
                placeholder="operador@eventfunnel.com"
                required
                autocomplete="username"
              />
            </div>
          </div>

          <!-- CAMPO SENHA -->
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label" for="inputSenha">Senha de Acesso</label>
            </div>
            <div class="input-icon-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input
                type="password"
                id="inputSenha"
                name="senha"
                class="form-control"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="btn-toggle-visibility"
                id="btnToggleSenha"
                title="Alternar visibilidade"
              >
                <span class="material-symbols-outlined" id="iconeToggleSenha">visibility</span>
              </button>
            </div>
          </div>

          <!-- BOTÃO SUBMIT -->
          <button type="submit" class="btn-login-submit" id="btnEntrar">
            <span class="btn-text">Entrar no Sistema</span>
            <span class="material-symbols-outlined btn-submit-icon">arrow_forward</span>
          </button>
        </form>

        <!-- RODAPÉ DE STATUS -->
        <div class="login-footer">
          <div class="connectivity-status">
            <span class="pulse-dot"></span>
            <span>Servidor Operacional Online</span>
          </div>
          <span class="system-version-tag">v2.4 Enterprise</span>
        </div>
      </div>
    </div>

    <div id="toastContainer"></div>
    <script src="/js/login.js"></script>
  </body>
</html>
